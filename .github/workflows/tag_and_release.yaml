name: Tag and Release package

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from CMakeLists.txt
        id: cmake_version
        shell: bash
        run: |
          VERSION=$(sed -zEn 's/.*project\([^)]*VERSION\s+([0-9.]+).*/\1/p' CMakeLists.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          sudo apt-get update
          grep -v '^#' DEPENDENCIES | xargs sudo apt-get install -y

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build package
        run: |
          cd build
          make package -j$(nproc)

      - name: Create release and upload package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.cmake_version.outputs.version }}
          name: Release v${{ steps.cmake_version.outputs.version }}
          files: build/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
